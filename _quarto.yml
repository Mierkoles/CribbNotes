project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notes/**/*.qmd"
    - "labs/**/*.qmd"
    - "speaking/**/*.qmd"
  resources:
    - CNAME

website:
  title: "Cribb Notes"
  description: "Tech and culture, demystified. Short, plain-language notes on AI, the enterprise, movies, music, and the human side of technology — by Mark Cribb."
  site-url: "https://cribbnotes.ai"
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    logo: CribbNotesLogo.png
    pinned: true
    left:
      - text: "Tech"
        href: tech.qmd
      - text: "Culture"
        href: culture.qmd
      - text: "Shelf"
        href: shelf.qmd
      - text: "Labs"
        href: labs/index.qmd
      - text: "Speaking"
        href: speaking/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: linkedin
        href: "https://www.linkedin.com/in/mark-cribb"
        aria-label: LinkedIn
      - icon: github
        href: "https://github.com/Mierkoles/CribbNotes"
        aria-label: GitHub
  page-footer:
    left: "© 2026 Mark Cribb · *Feels like magic, but it's math.*"
    right:
      - icon: rss
        href: index.xml
      - icon: linkedin
        href: "https://www.linkedin.com/in/mark-cribb"
      - icon: github
        href: "https://github.com/Mierkoles/CribbNotes"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    reading-time: true
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
